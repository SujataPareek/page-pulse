<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page Pulse — instant page audit</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262a33;
    --text: #e8eaed;
    --muted: #9aa1ac;
    --accent: #5b8cff;
    --good: #3ecf8e;
    --bad: #ff5c72;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  main { max-width: 720px; margin: 0 auto; padding: 48px 20px; width: 100%; flex: 1; }
  h1 { font-size: 1.6rem; margin-bottom: 4px; }
  p.sub { color: var(--muted); margin-top: 0; }
  form { display: flex; gap: 8px; margin: 24px 0; }
  input[type="url"] {
    flex: 1; padding: 12px 14px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text); font-size: 1rem;
  }
  input[type="url"]:focus { outline: none; border-color: var(--accent); }
  button {
    padding: 12px 20px; border-radius: 8px; border: none;
    background: var(--accent); color: white; font-size: 1rem; cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  #status { color: var(--muted); min-height: 1.4em; margin-bottom: 12px; }
  .report {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 20px 24px; display: none;
  }
  .report.error { border-color: var(--bad); }
  .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .row:last-child { border-bottom: none; }
  .label { color: var(--muted); }
  .value { font-weight: 600; text-align: right; max-width: 60%; word-break: break-word; }
  .badge { padding: 2px 8px; border-radius: 999px; font-size: 0.8rem; font-weight: 600; }
  .badge.ok { background: rgba(62,207,142,0.15); color: var(--good); }
  .badge.bad { background: rgba(255,92,114,0.15); color: var(--bad); }
  footer { text-align: center; padding: 20px; color: var(--muted); font-size: 0.85rem; }
  footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<main>
  <h1>Page Pulse</h1>
  <p class="sub">Paste a URL, get an instant structural + performance audit.</p>

  <form id="audit-form">
    <input type="url" id="url-input" placeholder="https://example.com" required />
    <button type="submit" id="submit-btn">Audit</button>
  </form>

  <div id="status"></div>
  <div class="report" id="report"></div>
</main>

<footer>
  Built for Digital Heroes Training Task — <a href="https://digitalheroesco.com" target="_blank" rel="noopener">digitalheroesco.com</a>
</footer>

<script src="script.js"></script>
</body>
</html>
